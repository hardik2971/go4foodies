# Firebase App Hosting (server-rendered Next.js) — replaces `next start` on the VPS.
# Create the backend once:  firebase apphosting:backends:create --project go4foodies --location asia-south1
runConfig:
  minInstances: 0
  maxInstances: 4
  cpu: 1
  memoryMiB: 512

env:
  # Backend API (Cloud Function behind Firebase Hosting) — same /api/* paths as the old admin.
  - variable: ADMIN_API_URL
    value: https://go4foodies.web.app
    availability: [RUNTIME]
  # Public site origin (sitemap, canonical URLs, metadata). Change when the custom domain is connected.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://themerchant.disolutions.net
    availability: [BUILD, RUNTIME]
